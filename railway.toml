# Railway config for BHT Revenue OS — CRM (apps/crm)
# Deploy from REPO ROOT. In Railway dashboard set Root Directory to empty or "."
# Redeploy trigger: 2026-06-10 SerpAPI key refresh

[build]
# Install all workspace deps (required for @bht/integrations)
buildCommand = "pnpm install"

[deploy]
# Idempotent 063–065 before each deploy (cashflow intel, bank CSV, recurring).
releaseCommand = "pnpm --filter @bht/crm run db:bank-cashflow-migrations"
startCommand = "pnpm --filter @bht/crm start"
